[package]
name = "hexdectc"
version = "1.0.0"
description = "HexDec TC Converter"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hexdectc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "HexDecTC"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
